name: 更新看板数据
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas lxml
      - run: python collect.py
        env:
          KOTE_API_KEY: ${{ secrets.KOTE_API_KEY }}
      - name: 提交最新快照
        run: |
          git config user.name "btc-dashboard-bot"
          git config user.email "bot@users.noreply.github.com"
          git add snapshot.json
          git diff --cached --quiet || git commit -m "data: 更新快照"
          git push
